; cnc-ddraw 7.1.0.0 settings for Sudden Strike 2 / Resource War on the Pi (project-owned).
; Copied next to game_exe.exe by scripts/pi/install-cnc-ddraw.sh. Keys left out use cnc-ddraw's
; defaults (see ~/ss2/tools/cnc-ddraw-7.1.0.0/x/ddraw.ini on the Pi for the full list).
; The game only has 4:3 modes (640x480, 800x600, 1024x768, chosen by sudtest.ini VideoMode).
; This turns its picture into a borderless window covering the whole display, stretched to the
; display's shape (maintas=false), so a 16:9 display has no side bars.
[ddraw]
; 0 = use the display's current size, whatever it is
width=0
height=0
; borderless full-screen window (no display mode change)
fullscreen=true
windowed=true
; stretch to fill; set maintas=true to keep 4:3 with black bars instead
maintas=false
boxing=false
adjmouse=true
renderer=opengl
shader=Shaders\interpolation\bilinear.glsl
vsync=false
maxfps=-1
border=false
savesettings=0
nonexclusive=true
singlecpu=true
no_compat_warning=true
